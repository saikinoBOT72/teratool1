    <h1>teratool</h1>
    <p>Terraria を遊ぶときに使う、自分用の小さなツール集です。</p>

  <main>
    <ul class="tools" aria-label="ツール一覧">
      <li>
        <a class="card" href="tools/paint/">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4z"/><path d="M14 17h6M17 14v6"/></svg>
          </span>
          <h2>ペンキドット絵</h2>
          <p>ペンキでドット絵の設計図を描く。ジェムスパークの壁の色で表示、画像の取り込み・建築ナビつき。</p>
        </a>
      </li>
      <li>
        <div class="card soon">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          </span>
          <h2>準備中</h2>
          <p>ツールは順次追加予定。</p>

      </li>
