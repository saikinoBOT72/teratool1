<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<title>ペンキドット絵</title>
<link rel="stylesheet" href="../../assets/base.css">
<link rel="stylesheet" href="paint.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-left">
      <a class="ib" href="../../" aria-label="ツール一覧へ戻る" title="ツール一覧へ戻る">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <div class="brand">
        <h1>ペンキドット絵</h1>
        <p id="sizeLabel">16 × 16マス</p>
      </div>
    </div>
    <div class="top-actions">
      <button class="ib" id="btnUndo" type="button" aria-label="元に戻す" title="元に戻す (Ctrl+Z)" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
      </button>
      <button class="ib" id="btnRedo" type="button" aria-label="やり直し" title="やり直し (Ctrl+Y)" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>
      </button>
      <button class="ib" id="btnGrid" type="button" aria-label="グリッド表示" aria-pressed="true" title="グリッド (G)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4zM4 12h16M12 4v16"/></svg>
      </button>
      <button class="ib" id="btnMenu" type="button" aria-label="メニュー" title="メニュー">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="cv" aria-label="ドット絵キャンバス"></canvas>
    <div class="readout" id="readout"></div>
    <div class="zoom">
      <button type="button" id="zOut" aria-label="縮小">−</button>
      <button type="button" id="zFit" aria-label="全体表示">全体</button>
      <button type="button" id="zIn" aria-label="拡大">+</button>
    </div>
  </main>

  <section class="dock" aria-label="道具とペンキ">
    <div class="tools" id="tools" role="toolbar" aria-label="道具">
      <button class="tool" type="button" data-tool="pen" aria-pressed="true" title="ペン (B)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19z"/><path d="M14 7l3 3"/></svg>ペン
      </button>
      <button class="tool" type="button" data-tool="eraser" aria-pressed="false" title="消しゴム (E)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15l8.5-8.5a2 2 0 0 1 2.8 0l3.2 3.2a2 2 0 0 1 0 2.8L11 20H7z"/><path d="M9 11l5 5"/></svg>消しゴム
      </button>
      <button class="tool" type="button" data-tool="fill" aria-pressed="false" title="塗りつぶし (F)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11l6-6 7 7-6 6a2 2 0 0 1-2.8 0L5 13.8a2 2 0 0 1 0-2.8z"/><path d="M19 15s2 2.2 2 3.5a2 2 0 0 1-4 0c0-1.3 2-3.5 2-3.5z"/></svg>塗りつぶし
      </button>
      <button class="tool" type="button" data-tool="pick" aria-pressed="false" title="スポイト (I)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l4 4"/><path d="M17.5 2.8a2 2 0 0 1 2.8 2.8l-2.3 2.3-2.8-2.8z"/><path d="M14 8.5L5 17.5V20h2.5l9-9"/></svg>スポイト
      </button>
      <button class="tool" type="button" data-tool="pan" aria-pressed="false" title="移動 (H)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 12V6a1.5 1.5 0 0 1 3 0v5M11 11V4.5a1.5 1.5 0 0 1 3 0V11M14 11V6a1.5 1.5 0 0 1 3 0v8c0 4-2.5 6-6 6-3 0-4.5-1.5-6-4l-1.7-3a1.5 1.5 0 0 1 2.6-1.5L8 14"/></svg>移動
      </button>
    </div>
    <div class="palette" id="palette" role="group" aria-label="ペンキの色"></div>
    <div class="status"><span id="selName"></span><span id="stats"></span></div>
  </section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <h2 id="sheetTitle">メニュー</h2>
      <button class="ib" id="btnClose" type="button" aria-label="閉じる">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <section>
      <h3>キャンバスのサイズ</h3>
      <div class="chips" id="presets">
        <button class="chip" type="button" data-n="16">16</button>
        <button class="chip" type="button" data-n="32">32</button>
        <button class="chip" type="button" data-n="48">48</button>
        <button class="chip" type="button" data-n="64">64</button>
        <button class="chip" type="button" data-n="96">96</button>
      </div>
      <div class="row">
        <label for="inW">幅<input id="inW" type="number" min="1" max="200" inputmode="numeric"></label>
        <label for="inH">高さ<input id="inH" type="number" min="1" max="200" inputmode="numeric"></label>
        <button class="btn" id="btnResize" type="button">サイズを変更</button>
      </div>
      <p class="hint">最大200マス。大きくすると右と下に広がり、小さくすると右と下が切れます。元に戻せます。</p>
      <div><button class="btn" id="btnClear" type="button">全部消す</button></div>
    </section>

    <section>
      <h3>画像を取り込む</h3>
      <p class="hint">写真や絵を、使える16色に置きかえます。書き出したPNG（1倍）もそのまま読み込めます。画像はこの端末の中だけで処理され、どこにも送信されません。</p>
      <input type="file" id="importFile" accept="image/*">
      <div id="importBody" hidden style="display:grid;gap:10px">
        <div class="row">
          <label for="importSize">長辺のマス数
            <select id="importSize">
              <option value="0">原寸</option>
              <option value="16">16</option>
              <option value="32">32</option>
              <option value="48">48</option>
              <option value="64" selected>64</option>
              <option value="96">96</option>
              <option value="128">128</option>
              <option value="200">200</option>
            </select>
          </label>
          <label class="chk" for="importDither"><input type="checkbox" id="importDither">ディザ（網点で階調を出す）</label>
        </div>
        <div class="preview"><canvas id="importPrev" aria-label="取り込み結果のプレビュー"></canvas></div>
        <p class="hint" id="importInfo"></p>
        <div><button class="btn primary" id="btnImport" type="button">この内容で取り込む</button></div>
      </div>
    </section>

    <section>
      <h3>PNGで書き出す</h3>
      <div class="row">
        <label for="exportScale">倍率
          <select id="exportScale">
            <option value="1">1倍（1マス=1px）</option>
            <option value="8" selected>8倍</option>
            <option value="16">16倍</option>
          </select>
        </label>
        <button class="btn primary" id="btnExport" type="button">PNGを保存</button>
      </div>
      <div id="exportFallback" hidden style="display:grid;gap:8px">
        <p class="hint">ダウンロードが始まらない場合は、下の画像を長押し（または右クリック）して保存してください。</p>
        <img id="exportImg" alt="書き出した画像">
      </div>
    </section>

    <section>
      <h3>表示</h3>
      <label class="chk" for="chkMajor"><input type="checkbox" id="chkMajor" checked>10マスごとに濃い線を入れる</label>
    </section>

    <section>
      <h3>色の調整</h3>
      <p class="hint">白い単色ブロックに塗ったときの見た目を想定した色です。ゲーム画面と見比べて、ずれていたら直せます。</p>
      <div class="paledit" id="palEdit"></div>
      <div><button class="btn" id="btnPalReset" type="button">初期値に戻す</button></div>
    </section>
  </div>
</div>

<script src="paint.js"></script>
</body>
</html>
