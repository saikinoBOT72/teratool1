<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#172026">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ペンキドット絵</title>
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="../../assets/base.css">
<link rel="stylesheet" href="../../assets/mobile.css">
<link rel="stylesheet" href="css/paint.css">
<link rel="stylesheet" href="css/sheet.css">
<link rel="stylesheet" href="css/bar.css">
<link rel="stylesheet" href="css/navi.css">
<link rel="stylesheet" href="css/works.css">
<link rel="stylesheet" href="css/import.css">
<link rel="stylesheet" href="css/wallmark.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-left">
      <a class="ib" href="../../" aria-label="ツール一覧へ戻る" title="ツール一覧へ戻る">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <div class="brand">
        <h1><button type="button" id="btnWorks" class="brand-btn" title="作品の一覧"><span id="workName">ペンキドット絵</span></button></h1>
        <p id="sizeLabel">16 × 16マス</p>
      </div>
    </div>
    <div class="top-actions">
      <button class="ib" id="btnUndo" type="button" aria-label="元に戻す" title="元に戻す (Ctrl+Z)" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
      </button>
      <button class="ib" id="btnRedo" type="button" aria-label="やり直し" title="やり直し (Ctrl+Y)" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>
      </button>
      <button class="ib" id="btnGrid" type="button" aria-label="グリッド表示" aria-pressed="true" title="グリッド (G)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4zM4 12h16M12 4v16"/></svg>
      </button>
      <button class="ib" id="btnWall" type="button" aria-label="壁の種類を表示" aria-pressed="false" title="壁の種類を表示 (D)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 9-7 9-7-9z" fill="currentColor" stroke="none" opacity="0.9"/></svg>
      </button>
      <button class="ib" id="btnMenu" type="button" aria-label="メニュー" title="メニュー">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="cv" aria-label="ドット絵キャンバス"></canvas>
    <div class="readout" id="readout"></div>
    <div class="zoom">
      <button type="button" id="zOut" aria-label="縮小">−</button>
      <button type="button" id="zFit" aria-label="全体表示">全体</button>
      <button type="button" id="zIn" aria-label="拡大">+</button>
    </div>
  </main>

  <section class="dock" aria-label="道具とペンキ">
    <div class="sel-panel" id="selPanel" hidden>
      <div class="sel-head">
        <span id="selInfo"></span>
        <button class="btn small" type="button" id="selFill" title="選択したマスを今のペンキで塗る">塗る</button>
        <button class="btn small" type="button" id="selErase" title="選択したマスを消す (Delete)">消す</button>
        <button class="btn small" type="button" id="selClear" title="選択を解除 (Esc)">解除</button>
      </div>
      <div class="sel-full" id="selFull">
        <div class="sel-row">
          <div class="segs" id="selModes" role="group" aria-label="選び方">
            <button type="button" data-mode="rect" title="ドラッグした四角を選ぶ">四角</button>
            <button type="button" data-mode="lasso" title="なぞって囲んだ内側を選ぶ">囲う</button>
            <button type="button" data-mode="wand" title="タップしたマスとつながった同じ色を選ぶ">同じ色</button>
            <button type="button" data-mode="color" title="タップしたマスと同じ色を全部選ぶ">同じ色(全体)</button>
          </div>
          <div class="segs" id="selOps" role="group" aria-label="今の選択との合わせ方">
            <button type="button" data-op="new" title="選び直す">新しく</button>
            <button type="button" data-op="add" title="今の選択に足す (Shift)">足す</button>
            <button type="button" data-op="sub" title="今の選択から引く (Alt)">引く</button>
          </div>
        </div>
        <div class="sel-row">
          <button class="btn small" type="button" id="selAll" title="全部選ぶ (Ctrl+A)">全部</button>
          <button class="btn small" type="button" id="selDrawn" title="透過でないマスを選ぶ">描いたマス</button>
          <button class="btn small" type="button" id="selInvert" title="選択を反転 (Ctrl+Shift+I)">反転</button>
        </div>
      </div>
    </div>
    <div class="bar" id="editPanel">
      <button class="bar-btn" type="button" id="btnTool" aria-expanded="false" aria-controls="toolPop" title="道具を選ぶ">
        <span class="bar-icon" id="toolIcon" aria-hidden="true"></span><span class="bar-label" id="toolName">ペン</span>
      </button>
      <button class="bar-btn" type="button" id="btnColor" aria-expanded="false" aria-controls="colorPop" title="ペンキを選ぶ">
        <i class="bar-chip" id="colorChip" aria-hidden="true"></i><span class="bar-label" id="selName">濃い赤</span>
      </button>
      <button class="bar-btn icon" type="button" id="btnMirror" aria-pressed="false" aria-label="左右対称" title="左右対称 (M)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18" stroke-dasharray="2 2.5"/><path d="M9 7L4 12l5 5zM15 7l5 5-5 5z"/></svg></button>
      <button class="bar-btn icon" type="button" id="btnNavi" aria-label="建築ナビ" title="建築ナビ (N)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><path d="M15 9l3 3-3 3"/></svg></button>
    </div>

    <div class="pop" id="toolPop" role="dialog" aria-label="道具" hidden>
      <div class="tools" id="tools" role="toolbar" aria-label="道具">
        <button class="tool" type="button" data-tool="pen" aria-pressed="true" title="ペン (B)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19z"/><path d="M14 7l3 3"/></svg>ペン</button>
        <button class="tool" type="button" data-tool="fill" aria-pressed="false" title="塗りつぶし (F)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11l6-6 7 7-6 6a2 2 0 0 1-2.8 0L5 13.8a2 2 0 0 1 0-2.8z"/><path d="M19 15s2 2.2 2 3.5a2 2 0 0 1-4 0c0-1.3 2-3.5 2-3.5z"/></svg>塗りつぶし</button>
        <button class="tool" type="button" data-tool="pick" aria-pressed="false" title="スポイト (I)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l4 4"/><path d="M17.5 2.8a2 2 0 0 1 2.8 2.8l-2.3 2.3-2.8-2.8z"/><path d="M14 8.5L5 17.5V20h2.5l9-9"/></svg>スポイト</button>
        <button class="tool" type="button" data-tool="pan" aria-pressed="false" title="移動 (H)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 12V6a1.5 1.5 0 0 1 3 0v5M11 11V4.5a1.5 1.5 0 0 1 3 0V11M14 11V6a1.5 1.5 0 0 1 3 0v8c0 4-2.5 6-6 6-3 0-4.5-1.5-6-4l-1.7-3a1.5 1.5 0 0 1 2.6-1.5L8 14"/></svg>移動</button>
        <button class="tool" type="button" data-tool="line" aria-pressed="false" title="直線 (L)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19L19 5"/><path d="M4 18h2v2H4zM18 4h2v2h-2z"/></svg>直線</button>
        <button class="tool" type="button" data-tool="rect" aria-pressed="false" title="四角 (R)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14v12H5z"/></svg>四角</button>
        <button class="tool" type="button" data-tool="rectFill" aria-pressed="false" title="塗り四角 (Shift+R)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14v12H5z" fill="currentColor"/></svg>塗り四角</button>
        <button class="tool" type="button" data-tool="ellipse" aria-pressed="false" title="円 (O)"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="8" ry="6.5"/></svg>円</button>
        <button class="tool" type="button" data-tool="select" aria-pressed="false" title="選択 (S)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4z" stroke-dasharray="3 2.5"/><path d="M9 9h6v6H9z" fill="currentColor" stroke="none"/></svg>選択</button>
      </div>
    </div>

    <div class="pop" id="colorPop" role="dialog" aria-label="ペンキ" hidden>
      <div class="color-controls" id="colorControls"></div>
      <div class="palette" id="palette" role="group" aria-label="ペンキの色"></div>
      <div class="status"><span id="selName2"></span><span id="stats"></span></div>
    </div>

    <div class="navi-panel" id="naviPanel" hidden>
      <div class="navi-head">
        <div class="segs" id="naviModes" role="group" aria-label="案内のしかた">
          <button type="button" data-nm="row">1行ずつ</button>
          <button type="button" data-nm="piece" title="つながった同じ色をかたまりごとにまとめて作る">まとめて</button>
        </div>
        <button class="opt" type="button" id="naviDir"></button>
      </div>
      <div class="navi-head">
        <strong id="naviRow"></strong>
      </div>
      <ol class="runs" id="naviRuns" aria-live="polite"></ol>
      <div class="navi-actions">
        <button class="btn" type="button" id="naviPrev">前の行</button>
        <button class="btn" type="button" id="naviNext">次の行</button>
        <button class="btn" type="button" id="naviExit">編集に戻る</button>
      </div>
    </div>
  </section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="scrim" id="menuSheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
    <div class="sheet-head">
      <h2 id="menuTitle">メニュー</h2>
      <button class="ib" type="button" data-close aria-label="閉じる"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <section>
      <h3>作品</h3>
      <div class="row">
        <button class="btn" id="menuWorks" type="button">作品の一覧・バックアップ</button>
        <button class="btn primary" id="menuImport" type="button">画像を取り込む</button>
      </div>
    </section>
    <section>
      <h3>キャンバスのサイズ</h3>
      <div class="chips" id="presets">
        <button class="chip" type="button" data-n="16">16</button>
        <button class="chip" type="button" data-n="32">32</button>
        <button class="chip" type="button" data-n="48">48</button>
        <button class="chip" type="button" data-n="64">64</button>
        <button class="chip" type="button" data-n="96">96</button>
      </div>
      <div class="row">
        <label for="inW">幅<input id="inW" type="number" min="1" max="200" inputmode="numeric"></label>
        <label for="inH">高さ<input id="inH" type="number" min="1" max="200" inputmode="numeric"></label>
        <button class="btn" id="btnResize" type="button">サイズを変更</button>
      </div>
      <p class="hint">最大200マス。大きくすると右と下に広がり、小さくすると右と下が切れます。元に戻せます。</p>
      <div><button class="btn" id="btnClear" type="button">全部消す</button></div>
    </section>
    <section>
      <h3>PNGで書き出す</h3>
      <div class="row">
        <label for="exportScale">倍率
          <select id="exportScale">
            <option value="1">1倍（1マス=1px）</option>
            <option value="8" selected>8倍</option>
            <option value="16">16倍</option>
          </select>
        </label>
        <button class="btn primary" id="btnExport" type="button">PNGを保存</button>
      </div>
      <div id="exportFallback" class="stack" hidden>
        <p class="hint">ダウンロードが始まらない場合は、下の画像を長押し（または右クリック）して保存してください。</p>
        <img id="exportImg" class="savable" alt="書き出した画像">
      </div>
    </section>
    <section>
      <h3>表示</h3>
      <label class="chk" for="chkMajor"><input type="checkbox" id="chkMajor" checked>10マスごとに濃い線を入れる</label>
      <label class="chk" for="chkWall"><input type="checkbox" id="chkWall">マスに壁の種類を表示する（◆ ダイヤ / 点線◇に斜線 ダイヤ以外、太陽 光オン / 空の丸 光オフ）</label>
      <p class="hint">拡大したときに表示されます。上の ◆ ボタンか D キーでも切り替えられます。</p>
    </section>
    <section>
      <h3>色の見え方</h3>
      <p class="hint">ジェムスパークの壁に塗ったときの色です。描いた中身は変わらず、表示の色だけが切りかわります。</p>
      <div class="color-controls" id="menuColorControls"></div>
    </section>
  </div>
</div>

<script type="module" src="js/main.js"></script>
<script type="module" src="../../assets/pwa.js"></script>
<script type="module" src="../../assets/mobile.js"></script>
</body>
</html>
